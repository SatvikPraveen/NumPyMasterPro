name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint, format & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: uv pip install --system -e ".[dev]"
      - name: Ruff lint
        run: ruff check scripts tests kmeans_app.py --output-format=github
      - name: Ruff format check
        run: ruff format --check scripts tests kmeans_app.py
      - name: mypy
        run: mypy

  test:
    name: Tests · ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        exclude:
          # Keep the matrix lean: full version sweep on Linux, latest-only elsewhere.
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev extras
        run: uv pip install --system -e ".[dev]"
      - name: Run tests
        run: pytest -n auto --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  notebooks:
    name: Execute notebooks
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with notebook + dev extras
        run: uv pip install --system -e ".[dev,notebooks]"
      - name: Execute every notebook
        # Each notebook must run top-to-bottom without error. A failure here is
        # a real failure (no `|| echo` masking).
        run: |
          set -euo pipefail
          for nb in notebooks/*.ipynb; do
            echo "::group::$nb"
            jupyter nbconvert --to notebook --execute "$nb" \
              --ExecutePreprocessor.timeout=300 --output "/tmp/$(basename "$nb")"
            echo "::endgroup::"
          done

  security:
    name: Security scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit and pip-audit
        run: pip install bandit pip-audit
      - name: Bandit (medium severity and above)
        run: bandit -r scripts kmeans_app.py -ll
      - name: pip-audit on runtime dependencies
        # Advisory only: new CVEs in transitive deps should not block unrelated PRs.
        continue-on-error: true
        run: pip-audit -r requirements.txt

  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: numpymasterpro:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the package inside the image
        run: |
          docker run --rm numpymasterpro:ci python -c "
          import numpy, scripts
          from scripts import KMeans, generate_data
          km = KMeans(n_clusters=3, seed=0).fit(generate_data())
          print('numpy', numpy.__version__, '| scripts', scripts.__version__, '| inertia', round(km.inertia_, 2))
          "

  build-status:
    name: Build status
    runs-on: ubuntu-latest
    needs: [lint, test, notebooks, security, docker]
    if: always()
    steps:
      - name: Fail if any required job failed
        run: |
          echo "lint=${{ needs.lint.result }} test=${{ needs.test.result }} notebooks=${{ needs.notebooks.result }} security=${{ needs.security.result }} docker=${{ needs.docker.result }}"
          for r in "${{ needs.lint.result }}" "${{ needs.test.result }}" "${{ needs.notebooks.result }}" "${{ needs.security.result }}" "${{ needs.docker.result }}"; do
            if [ "$r" != "success" ]; then echo "::error::a required job did not succeed"; exit 1; fi
          done
          echo "✅ All checks passed"
